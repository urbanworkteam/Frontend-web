# Frontend-web CI/CD (소비자 웹 SPA — Vite + React 19)
# - feat/main push, main PR: 검증(ci = 타입체크 + 정적 빌드)
# - 배포(S3 sync + CloudFront 무효화)는 Phase 2 — 배포 대상 인프라(S3/CloudFront) 완성 후 주석 해제
#
# 전제: GitHub Secrets — AWS_ROLE_ARN(farmily-cicd-frontend-web-role, 등록 완료)
#       Phase 2 추가 시 필요값: S3 버킷명, CloudFront distribution ID (Terraform output)

name: Web CI/CD

on:
  pull_request:
    branches: [main]      # feat → main PR: 검증(ci)만
  push:
    branches: [feat, main]

permissions:
  contents: read          # ci는 OIDC 불필요 — id-token은 Phase 2 deploy에서만 (아래 주석)

jobs:
  # ─── Job 1: CI (타입체크 + 정적 빌드) ───  PR·push 공통
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci          # lock 기준 정확 재현 (Mobile과 달리 peer dep 충돌 없음)

      - name: Type check
        run: npm run typecheck   # tsc --noEmit

      - name: Build
        run: npm run build       # tsc --noEmit && vite build → dist/ (정적 산출물 검증)

