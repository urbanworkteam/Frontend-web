# Frontend-web CI/CD (소비자 웹 SPA — Vite + React 19)
# - feat/main push, main PR: 검증(ci = 타입체크 + 정적 빌드)
# - 배포(deploy = S3 sync + CloudFront 무효화): main 푸시에서만 실행 (prod 단일)
#   ※ 배포 환경 = prod 단일 확정(ADR-005 업데이트 2026-06-07): 소비자 SPA의 dev는 로컬 npm run dev로 대체,
#     dev용 S3/CloudFront는 미운영. 추후 dev 미리보기 배포가 필요해지면 deploy-dev job을 추가(확장 가능).
#
# 전제: GitHub Secrets — AWS_ROLE_ARN(frontend-web-role) / S3_BUCKET / CF_DISTRIBUTION (모두 등록 완료, 2026-06-08)

name: Web CI/CD

on:
  pull_request:
    branches: [main]      # feat → main PR: 검증(ci)만
  push:
    branches: [feat, main]

permissions:
  contents: read          # ci는 OIDC 불필요 — id-token은 deploy job에서 별도 부여

jobs:
  # ─── Job 1: CI (타입체크 + 정적 빌드) ───  PR·push 공통
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci          # lock 기준 정확 재현 (Mobile과 달리 peer dep 충돌 없음)

      - name: Type check
        run: npm run typecheck   # tsc --noEmit

      - name: Build
        run: npm run build       # tsc --noEmit && vite build → dist/ (정적 산출물 검증)

  # ─── Job 2: Deploy (S3 + CloudFront) ─── main 푸시에서만 운영 배포
  deploy:
    needs: ci                              # ci(타입체크+빌드) 성공해야 배포 — 깨진 코드 배포 차단
    if: github.ref_name == 'main'          # main 푸시만 운영 배포 (feat는 검증까지만)
    runs-on: ubuntu-latest
    permissions:
      id-token: write                      # OIDC 토큰 발급 (AWS 인증) — job 단위로만 부여(최소권한)
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }

      - name: Install & Build
        run: |
          npm ci
          npm run build                    # ci와 별도 러너라 dist/ 재생성 필요

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a  # v4.3.1 (SHA 핀: 공급망 공격 방지)
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Sync to S3                    # dist/ → 버킷. --delete로 삭제된 파일도 반영
        run: aws s3 sync dist/ s3://${{ secrets.S3_BUCKET }} --delete

      - name: Invalidate CloudFront         # 엣지 캐시 무효화 — 신규 배포 즉시 반영
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.CF_DISTRIBUTION }} --paths "/*"
